<!doctype html>
            
<html lang="en">

<head>
<meta charset="utf-8">
<title>my index page</title>
<link rel="shortcut icon" href="favicon.ico" />
<style>
#one{
width: 100px;
height: 100px;
background: orchid;
border: 3px solid rebeccapurple;

}
#one:hover{
  background:darkblue;
  border: 3px solid royalblue;
  transform: rotate(20deg)scale(1);
}
#two{
width: 100px;
height: 100px;
background: yellow;
border: 3px solid goldenrod;
}
#two:hover{
  background:greenyellow;
  border: 3px solid green;
  border-radius: 50%;
}
#three{
width: 100px;
height: 100px;
background: brown;
border: 3px solid peru;
}
#three:hover{
  background:orangered;
  border: 3px solid orange;
  box-shadow: 0px 10px 10px magenta;
}
#four{
width: 100px;
height: 100px;
background: black;
border: 3px solid gainsboro;
}
#four:hover{
  background:red;
  border: 3px solid grey;
  transform: rotate(20deg)scale(10);
}
</style>
</head>
            
<body>
<div id="one"></div>
<div id="two"></div>
<div id="three"></div>
<div id="four"></div>
</body>

</html>
