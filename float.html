<!doctype html>
            
<html lang="en">

<head>
<meta charset="utf-8">
<title>float</title>
<link rel="shortcut icon" href="favicon.ico" />
<style>
.right{
    float: right;
    margin-left: 20px;
}
.right::after{
    content: "";
    clear: both;
    display: table;
}
.left{
    float: left;
    margin-right: 20px;
}
.left::after{
    content: "";
    clear: both;
    display: table;
}
</style>
</head>

<body>
<img class="right" src="pineapple.jpg" alt="spunchbob's house">
<img class="left" src="pineapple.jpg" alt="spunchbob's house">
