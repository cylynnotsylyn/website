<!doctype html>
            
<html lang="en">

<head>
<meta charset="utf-8">
<title>box model</title>
<link rel="shortcut icon" href="favicon.ico" />
<style>
div{
    background: purple;
    color: pink;
    width: 200px;
    height: 200px;
    border: 2px dotted plum;
    padding: 20px;
    margin: 20px;
box-shadow: 10px 10px 10px mediumvioletred;
}

#two{
    background: black;
    border-bottom: 15px solid white;
    border-radius: 50px;
    box-shadow: 10px 10px 10px royalblue;
}
#three{
background: mediumspringgreen;
border: 50px dashed brown;
border-radius: 30px;
box-shadow: 30px 50px 40px orangered;
}
#four{
background: burlywood;
border: 50px solid peru;
box-shadow: 10px 10px 10px brown;
}

</style>
</head>
            
<body>
<div id="one">content</div>


<div id="two"></div>


<div id="three"></div>


<div id="four"></div>


</body>

</html>
